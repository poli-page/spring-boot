name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
        spring-boot: ['3.2.+', '3.3.+', '3.4.+']
    steps:
      - name: Check out spring-boot
        uses: actions/checkout@v4
        with:
          path: spring-boot

      - name: Check out sdk-java (sibling, for SNAPSHOT resolution via mavenLocal)
        uses: actions/checkout@v4
        with:
          repository: poli-page/sdk-java
          path: sdk-java
          ref: main

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Install sdk-java to ~/.m2 (snapshot bootstrap)
        working-directory: sdk-java
        run: ./mvnw -B install -DskipTests

      - uses: gradle/actions/setup-gradle@v4

      - name: Pin Spring Boot version
        working-directory: spring-boot
        run: |
          if [ -f gradle.properties ]; then
            sed -i "s/^springBootVersion=.*/springBootVersion=${{ matrix.spring-boot }}/" gradle.properties
          fi

      - name: Build
        working-directory: spring-boot
        run: |
          if [ -f settings.gradle.kts ]; then
            ./gradlew --no-daemon build
          else
            echo "settings.gradle.kts not present yet — skipping build"
          fi

      - name: Spotless check
        working-directory: spring-boot
        run: |
          if [ -f build.gradle.kts ]; then
            ./gradlew --no-daemon spotlessCheck
          else
            echo "build.gradle.kts not present yet — skipping spotlessCheck"
          fi

  integration:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Check out spring-boot
        uses: actions/checkout@v4
        with:
          path: spring-boot

      - name: Check out sdk-java (sibling, for SNAPSHOT resolution via mavenLocal)
        uses: actions/checkout@v4
        with:
          repository: poli-page/sdk-java
          path: sdk-java
          ref: main

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install sdk-java to ~/.m2 (snapshot bootstrap)
        working-directory: sdk-java
        run: ./mvnw -B install -DskipTests

      - uses: gradle/actions/setup-gradle@v4

      - name: Integration test against develop API
        working-directory: spring-boot
        env:
          POLI_PAGE_API_KEY: ${{ secrets.POLI_PAGE_DEVELOP_API_KEY }}
        run: |
          if [ -z "$POLI_PAGE_API_KEY" ]; then
            echo "POLI_PAGE_API_KEY not set — skipping integration test"
            exit 0
          fi
          # The *IT classes live in the starter's test source set and run only when the key is set.
          # --rerun: the key is not a task input, so a cached keyless result would skip them.
          ./gradlew --no-daemon :poli-page-spring-boot-starter:test --tests '*IT' --rerun
          # A key the IT's @EnabledIfEnvironmentVariable rejects skips the IT and the build stays green.
          suite=$(grep -s '<testsuite ' poli-page-spring-boot-starter/build/test-results/test/TEST-page.poli.sdk.spring.web.RenderAgainstDevelopApiIT.xml || true)
          if [[ "$suite" != *' skipped="0"'* || "$suite" == *' tests="0"'* ]]; then
            echo "::error::POLI_PAGE_API_KEY is set but RenderAgainstDevelopApiIT did not run (skipped or no report). Check the key's format against the IT's @EnabledIfEnvironmentVariable."
            exit 1
          fi
