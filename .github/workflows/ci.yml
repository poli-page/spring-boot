name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
        spring-boot: ['3.2.+', '3.3.+', '3.4.+']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Pin Spring Boot version
        run: sed -i "s/^springBootVersion=.*/springBootVersion=${{ matrix.spring-boot }}/" gradle.properties

      # The example apps run the contract tests: show that they follow the matrix's Spring Boot.
      - name: Spring Boot resolved by the example apps
        run: |
          boot='${{ matrix.spring-boot }}'
          boot="${boot%+}"
          for app in mvc webflux; do
            web=spring-web$app
            [ "$app" = mvc ] || web=spring-webflux
            for dep in org.springframework.boot:spring-boot "org.springframework:$web"; do
              out=$(./gradlew -q ":example-app:$app:dependencyInsight" --dependency "$dep" --configuration testRuntimeClasspath)
              line=${out%%$'\n'*}
              echo "example-app:$app resolves $line"
              if [ "$dep" = org.springframework.boot:spring-boot ] && [[ "$line" != *":spring-boot:$boot"* ]]; then
                echo "::error::example-app:$app does not resolve Spring Boot $boot*"
                exit 1
              fi
            done
          done

      - name: API contract
        id: contract
        uses: poli-page/api-contract@0eba96c1ecf9a28b7e259f444f3ca5b7c059d5fd # v1.3.0

      # Runs every module's tests, the example apps' ContractTest included.
      - name: Build
        env:
          POLI_CONTRACT: ${{ steps.contract.outputs.path }}
        run: ./gradlew --no-daemon build

      - name: Spotless check
        run: ./gradlew --no-daemon spotlessCheck

  integration:
    runs-on: ubuntu-latest
    needs: test
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Check for the sandbox API key
        id: key
        env:
          POLI_PAGE_API_KEY: ${{ secrets.POLI_PAGE_API_KEY }}
        run: |
          case "$POLI_PAGE_API_KEY" in
            pp_sandbox_*) echo "present=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::notice::POLI_PAGE_API_KEY is not set or is not a pp_sandbox_ key: skipping the live API test."
              echo "present=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'

      - uses: actions/setup-java@v4
        if: steps.key.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        if: steps.key.outputs.present == 'true'

      - name: Live API test (sandbox key)
        if: steps.key.outputs.present == 'true'
        env:
          POLI_PAGE_API_KEY: ${{ secrets.POLI_PAGE_API_KEY }}
          POLI_PAGE_BASE_URL: ${{ secrets.POLI_PAGE_BASE_URL }}
        run: |
          # An unset secret expands to an empty string; drop it so the starter
          # falls back to the SDK default base URL.
          if [ -z "$POLI_PAGE_BASE_URL" ]; then unset POLI_PAGE_BASE_URL; fi
          # The *IT classes live in the starter's test source set and run only when the key is set.
          # --rerun: the key is not a task input, so a cached keyless result would skip them.
          ./gradlew --no-daemon :poli-page-spring-boot-starter:test --tests '*IT' --rerun
          # A key the IT's @EnabledIfEnvironmentVariable rejects skips the IT and the build stays green.
          suite=$(grep -s '<testsuite ' poli-page-spring-boot-starter/build/test-results/test/TEST-page.poli.sdk.spring.web.RenderAgainstDevelopApiIT.xml || true)
          if [[ "$suite" != *' skipped="0"'* || "$suite" == *' tests="0"'* ]]; then
            echo "::error::POLI_PAGE_API_KEY is set but RenderAgainstDevelopApiIT did not run (skipped or no report). Check the key's format against the IT's @EnabledIfEnvironmentVariable."
            exit 1
          fi
