group=page.poli
version=0.1.0-SNAPSHOT

# Spring Boot version used by io.spring.dependency-management.
# Overridden in CI per matrix cell (3.2.+ / 3.3.+ / 3.4.+).
springBootVersion=3.4.1

# Spring Dependency Management plugin version (compatible with Gradle 8.10).
springDependencyManagementVersion=1.1.6

# Plugin versions.
spotlessVersion=6.25.0
errorpronePluginVersion=4.0.1
errorproneCoreVersion=2.34.0
nullawayVersion=0.11.4

# Build settings.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Cap JVM heap + parallel workers so the build stays inside a typical
# Docker/CI memory envelope (~1 GiB). On unconstrained hosts the defaults
# can spawn enough worker JVMs to OOM-kill the Gradle daemon mid-build.
# Override with `-Dorg.gradle.jvmargs=...` if you have more headroom.
org.gradle.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=256m
org.gradle.workers.max=2
